<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cookit — stop deciding, start cooking</title>
    <meta
      name="description"
      content="Your recipes, your shelf, and a wheel that decides what's for dinner. Filter by what's actually in the fridge and spin."
    />
    <meta name="theme-color" content="#14100e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fdf6ec" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Cookit" />
    <meta property="og:description" content="Spin the wheel. Cook the thing." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installed-app chrome. apple-mobile-web-app-capable is the legacy
         spelling iOS still reads; mobile-web-app-capable is the standard one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cookit" />
    <!-- iOS ignores the manifest icons and reads this one. It must be a PNG
         with no transparency: iOS composites it on black otherwise. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Stamp the saved theme before first paint. Without this the app flashes
      // dark for a frame on a light-theme reload.
      (function () {
        try {
          var saved = localStorage.getItem('cookit_theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* private mode — the default in the markup stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
